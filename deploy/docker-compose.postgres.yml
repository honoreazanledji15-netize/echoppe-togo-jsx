services:
  postgres:
    image: postgres:16-alpine
    container_name: echoppe-togo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: echoppe_togo
      POSTGRES_USER: echoppe_user
      POSTGRES_PASSWORD: change-this-database-password
    ports:
      - "5432:5432"
    volumes:
      - echoppe_postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  echoppe_postgres_data:
