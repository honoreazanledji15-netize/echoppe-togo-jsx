# Remplacez les domaines et le chemin des certificats avant activation.
# Le certificat peut être géré avec Certbot/Let's Encrypt.

server {
    listen 80;
    listen [::]:80;
    server_name echoppe.tg www.echoppe.tg;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name echoppe.tg www.echoppe.tg;

    ssl_certificate /etc/letsencrypt/live/echoppe.tg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/echoppe.tg/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 65M;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
